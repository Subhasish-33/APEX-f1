name: API Health Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  health-check:
    name: Verify Railway API Health
    runs-on: ubuntu-latest
    steps:
      - name: Check /health endpoint
        run: |
          RESPONSE=$(curl -s -o /tmp/health.json -w "%{http_code}" "${{ secrets.RAILWAY_API_URL }}/health")
          echo "HTTP Status: $RESPONSE"
          cat /tmp/health.json

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Health check failed — HTTP $RESPONSE"
            exit 1
          fi

          DB_OK=$(cat /tmp/health.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('db_connected', False))")
          REDIS_OK=$(cat /tmp/health.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('redis_connected', False))")

          if [ "$DB_OK" != "True" ]; then
            echo "❌ Database not connected"
            exit 1
          fi

          if [ "$REDIS_OK" != "True" ]; then
            echo "❌ Redis not connected"
            exit 1
          fi

          echo "✅ All services healthy"
          echo "  DB:    $DB_OK"
          echo "  Redis: $REDIS_OK"
