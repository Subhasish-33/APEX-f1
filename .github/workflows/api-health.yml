name: API Health Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  health-check:
    name: Verify Railway API Health
    runs-on: ubuntu-latest
    steps:
      - name: Check liveness endpoint
        run: |
          if [ -z "${{ secrets.RAILWAY_API_URL }}" ]; then
            echo "⚠️  WARNING: RAILWAY_API_URL secret is missing. Skipping automated health check."
            echo "To enable this check, add the secret in: Settings > Secrets and variables > Actions"
            exit 0
          fi
          RESPONSE=$(curl -s -o /tmp/live.json -w "%{http_code}" "${{ secrets.RAILWAY_API_URL }}/health/live")
          echo "HTTP Status: $RESPONSE"
          cat /tmp/live.json

          if [ "$RESPONSE" != "200" ]; then
            echo "Liveness check failed — HTTP $RESPONSE"
            exit 1
          fi

      - name: Check readiness endpoint
        run: |
          RESPONSE=$(curl -s -o /tmp/ready.json -w "%{http_code}" "${{ secrets.RAILWAY_API_URL }}/health/ready")
          echo "HTTP Status: $RESPONSE"
          cat /tmp/ready.json

          if [ "$RESPONSE" != "200" ]; then
            echo "Readiness check failed — HTTP $RESPONSE"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import sys
          with open("/tmp/ready.json") as f:
              payload = json.load(f)

          # Hardened Schema check: database and redis are now root properties
          db_status = payload.get("database")
          redis_status = payload.get("redis")
          
          unhealthy = []
          if db_status != "healthy": unhealthy.append(f"database:{db_status}")
          if redis_status != "healthy": unhealthy.append(f"redis:{redis_status}")

          if payload.get("status") != "ready" or unhealthy:
              print(f"❌ Unhealthy dependencies: {unhealthy}")
              sys.exit(1)
          PY

          echo "✅ All service dependencies are ready"
