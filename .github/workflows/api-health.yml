name: API Health Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  health-check:
    name: Verify Railway API Health
    runs-on: ubuntu-latest
    steps:
      - name: Check liveness endpoint
        run: |
          RESPONSE=$(curl -s -o /tmp/live.json -w "%{http_code}" "${{ secrets.RAILWAY_API_URL }}/health/live")
          echo "HTTP Status: $RESPONSE"
          cat /tmp/live.json

          if [ "$RESPONSE" != "200" ]; then
            echo "Liveness check failed — HTTP $RESPONSE"
            exit 1
          fi

      - name: Check readiness endpoint
        run: |
          RESPONSE=$(curl -s -o /tmp/ready.json -w "%{http_code}" "${{ secrets.RAILWAY_API_URL }}/health/ready")
          echo "HTTP Status: $RESPONSE"
          cat /tmp/ready.json

          if [ "$RESPONSE" != "200" ]; then
            echo "Readiness check failed — HTTP $RESPONSE"
            exit 1
          fi

          python3 - <<'PY'
          import json
          with open("/tmp/ready.json") as f:
              payload = json.load(f)

          deps = payload.get("dependencies", {})
          failed = [
              name for name, value in deps.items()
              if value.get("status") != "healthy"
          ]
          if payload.get("status") != "ready" or failed:
              raise SystemExit(f"Unhealthy dependencies: {failed}")
          PY

          echo "All service dependencies are ready"
