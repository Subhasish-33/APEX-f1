[build]
builder = "NIXPACKS"

[deploy]
# Hardcoding port 8000 to match the Railway Networking configuration.
# This resolves the 502 Bad Gateway caused by the 8080/8000 mismatch.
startCommand = "uvicorn main:app --host 0.0.0.0 --port 8000"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
