[build]
builder = "NIXPACKS"

[deploy]
# Gunicorn with uvicorn workers is the production standard for FastAPI.
# This handles the $PORT binding and process signals more reliably.
startCommand = "gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10